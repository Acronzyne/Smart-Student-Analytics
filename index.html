<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Student Analytics</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">📊</div>
          <div class="logo-text">
            <h1>Smart Student</h1>
            <span>Analytics</span>
          </div>
        </div>
      </div>
      <nav class="nav">
        <a href="#dashboard" class="nav-item active" data-route="dashboard">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#students" class="nav-item" data-route="students">
          <span class="nav-icon">👥</span>
          <span class="nav-label">Data Siswa</span>
        </a>
        <a href="#analytics" class="nav-item" data-route="analytics">
          <span class="nav-icon">📈</span>
          <span class="nav-label">Learning Analytics</span>
        </a>
        <a href="#interests" class="nav-item" data-route="interests">
          <span class="nav-icon">🎯</span>
          <span class="nav-label">Minat &amp; Bakat</span>
        </a>
        <a href="#learning" class="nav-item" data-route="learning">
          <span class="nav-icon">💡</span>
          <span class="nav-label">Personalized Learning</span>
        </a>
        <a href="#management" class="nav-item" data-route="management">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Manajemen Siswa</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="teacher-info">
          <div class="teacher-avatar">G</div>
          <div>
            <strong>Budi Santoso</strong>
            <span>Guru Wali Kelas 8A</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Buka menu">
          <span></span><span></span><span></span>
        </button>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="topbar-right">
          <span class="school-year">Tahun Ajaran 2024/2025</span>
        </div>
      </header>
      <div class="content" id="content">
        <!-- Dynamic content rendered here -->
      </div>
    </main>
  </div>

  <!-- Scripts: load order matters -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/students.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/interests.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/management.js"></script>
</body>
</html>
